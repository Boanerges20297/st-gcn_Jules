version: '3.8'

services:
  # Serviço Flask - Aplicação principal
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: st-gcn-app
    ports:
      - ${APP_PORT:-5000}:5000
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_PATH=${MODEL_PATH:-./models/stgcn_model_v2.pth}
      - DATA_PATH=${DATA_PATH:-./data}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - cache
    networks:
      - st-gcn-network
    labels:
      - "com.st-gcn.component=application"
      - "com.st-gcn.version=week5"

  # Redis - Cache para melhorar performance
  cache:
    image: redis:7-alpine
    container_name: st-gcn-cache
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - st-gcn-network
    labels:
      - "com.st-gcn.component=cache"

  # Prometheus - Métricas do sistema
  prometheus:
    image: prom/prometheus:latest
    container_name: st-gcn-prometheus
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - st-gcn-network
    labels:
      - "com.st-gcn.component=monitoring"

  # Grafana - Visualização de métricas
  grafana:
    image: grafana/grafana:latest
    container_name: st-gcn-grafana
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - st-gcn-network
    labels:
      - "com.st-gcn.component=monitoring"

volumes:
  cache_data:
  prometheus_data:
  grafana_data:

networks:
  st-gcn-network:
    driver: bridge
